apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

commonAnnotations:
  argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true

resources:
  - ../default
  - service-ca-injection.yaml
  - kuadrant-persesdatasource-fix.yaml

patches:
  - target:
      kind: DSCInitialization
      name: default-dsci
    patch: |-
      - op: add
        path: /spec/monitoring/metrics
        value:
          storage:
            size: 5Gi
            retention: 1d
      - op: add
        path: /spec/monitoring/namespace
        value: redhat-ods-monitoring

components:
  # - ../../components/custom-workbenches
  - ../../components/metrics
  # - ../../components/odh-applications
  - ../../components/model-registry
  - ../../components/mlflow
  # - ../../components/accelerator-profiles