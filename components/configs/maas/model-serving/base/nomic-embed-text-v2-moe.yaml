---
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  annotations:
    modelFormat: vLLM
    opendatahub.io/connections: nomic-embed-text-v2-moe
    opendatahub.io/model-type: generative
    openshift.io/description: ''
    openshift.io/display-name: nomic-embed-text-v2-moe
    security.opendatahub.io/enable-auth: 'false'
    serving.kserve.io/deploymentMode: Standard
  name: nomic-embed-text-v2-moe
  namespace: llm
  labels:
    opendatahub.io/dashboard: 'true'
spec:
  predictor:
    automountServiceAccountToken: false
    deploymentStrategy:
      type: Recreate
    maxReplicas: 1
    minReplicas: 1
    model:
      args:
        - '--model=/mnt/models'
        - '--served-model-name=nomic-embed-text-v2-moe'
        - '--trust-remote-code'
      env:
        - name: HF_HUB_OFFLINE
          value: '0'
        - name: TRANSFORMERS_OFFLINE
          value: '1'
      modelFormat:
        name: vLLM
      name: ''
      resources:
        limits:
          cpu: '6'
          memory: 22Gi
          nvidia.com/gpu: '1'
        requests:
          cpu: '4'
          memory: 18Gi
          nvidia.com/gpu: '1'
      runtime: vllm-rhoai-3.3
      storageUri: 'pvc://models/nomic-ai/nomic-embed-text-v2-moe'
    timeout: 600
    tolerations:
      - effect: NoSchedule
        key: nvidia.com/gpu
        operator: Equal
        value: Tesla-T4-PRIVATE
