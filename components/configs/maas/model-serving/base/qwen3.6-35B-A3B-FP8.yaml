apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  annotations:
    openshift.io/display-name: Qwen3.6-35B-A3B-FP8
    serving.kserve.io/deploymentMode: RawDeployment
  name: qwen36-35b-a3b-fp8
  labels:
    opendatahub.io/dashboard: 'true'
spec:
  predictor:
    automountServiceAccountToken: false
    maxReplicas: 1
    minReplicas: 1
    model:
      args:
        - '--served-model-name=qwen36-35b-a3b-fp8'
        - '--tensor-parallel-size=4'
        - '--max-model-len=262144'
        - '--gpu-memory-utilization=0.95'
        - '--kv-cache-dtype=fp8'
        - '--enable-prefix-caching'
        - '--enable-auto-tool-choice'
        - '--tool-call-parser=qwen3_coder'
        - '--reasoning-parser=qwen3'
        - '--mm-encoder-tp-mode=data'
        - '--mm-processor-cache-type=shm'
      modelFormat:
        name: vLLM
      name: ''
      resources:
        limits:
          cpu: '44'
          memory: 360Gi
          nvidia.com/gpu: '4'
        requests:
          cpu: '32'
          memory: 300Gi
          nvidia.com/gpu: '4'
      runtime: vllm-rhaiis-3.3.1
      storage:
        key: aws-connection-models
        path: Qwen/Qwen3.6-35B-A3B-FP8/
    tolerations:
      - effect: NoSchedule
        key: nvidia.com/gpu
        operator: Equal
        value: NVIDIA-L40S-MULTI-PRIVATE